# qcheck configuration — sourced by tools/qcheck.sh (bash key=value).

# Enable/disable scanners
CHECKSTYLE_ENABLED=true
PMD_ENABLED=true

# Pinned tool versions (downloaded once to ~/.qcheck/tools)
CHECKSTYLE_VERSION=10.21.1
PMD_VERSION=7.10.0

# Rulesets (default: the curated ones shipped in this directory)
# CHECKSTYLE_RULESET=/path/to/custom-checkstyle.xml
# PMD_RULESET=/path/to/custom-pmd.xml

# Gate fails when total findings exceed this budget
MAX_VIOLATIONS=0

# ---------- optional project-level scanners (off by default) ----------
# These scan the WHOLE project, need external auth, and take much longer than
# Checkstyle/PMD — enable for pre-commit/CI or /quality-gate runs, not for the
# after-every-iteration hook.

# Snyk (https://snyk.io) — requires the snyk CLI on PATH + `snyk auth` once.
SNYK_ENABLED=false            # `snyk code test` — SAST on the source
SNYK_DEPS_ENABLED=false       # `snyk test` — vulnerable dependencies
SNYK_SEVERITY_THRESHOLD=low   # low | medium | high | critical

# SonarQube/SonarCloud — requires sonar-scanner on PATH and a server.
# Project settings come from sonar-project.properties, or set them here.
# Gradle projects: Sonar's Java rules need bytecode — build first and set
# sonar.java.binaries=build/classes/java/main in sonar-project.properties
# (or use the org.sonarqube Gradle plugin, `./gradlew sonar`, instead).
SONAR_ENABLED=false
# SONAR_HOST_URL=https://sonarcloud.io
# SONAR_TOKEN=...               # or export it in the environment
# SONAR_PROJECT_KEY=my-project
