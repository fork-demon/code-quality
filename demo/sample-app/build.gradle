plugins {
    id 'java'
    id 'checkstyle'
    id 'pmd'
}

repositories { mavenCentral() }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.15.2'
}

test { useJUnitPlatform() }

// The repo's OWN rule config is the single source of truth — the quality pack
// ships none. Defaults here are deliberately ordinary so the verbose demo
// change passes them: that is the gap the PR review lens fills.
checkstyle {
    toolVersion = '10.21.1'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
}
pmd {
    toolVersion = '7.10.0'
    ruleSetFiles = files('config/pmd/ruleset.xml')
    ruleSets = []
    ignoreFailures = false
}
