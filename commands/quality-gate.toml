# /quality-gate [optional: extra files to check]
# Run the static-analysis gate (Checkstyle + PMD via qcheck) and fix findings.

description = "Run the Checkstyle/PMD quality gate on changed files and fix all findings"

prompt = """
Run the repository quality gate and drive it to green.

1. Execute: `bash tools/qcheck.sh {{args}}`
   (from the quality pack root; if the pack is installed elsewhere, locate
   qcheck.sh under the directory containing this command). With no args it
   checks the changed files in the working tree.
2. If the gate passes (exit 0), report the summary and stop.
3. If it fails, fix the findings following the
   `fixing-static-analysis-findings` skill: root-cause fixes, never editing
   rulesets/config/suppressions to pass. Re-run the gate after fixing.
4. Repeat at most 3 fix cycles. If findings remain after that, stop and report
   the remaining findings with your assessment instead of looping.

Report at the end: findings fixed (by rule), findings remaining (if any), and
the final gate status.
"""
