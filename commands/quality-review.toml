# /quality-review [files, branch, or diff to review]
description = "Minimal-twin review: how much of this change is unnecessary, and is the rest tested and safe"

prompt = """
Review the current change with the `minimal-twin-review` skill.

Target: {{args}}
If none was given, review the working-tree diff against the base branch
(origin/main or origin/master), including untracked source files.

Build the twin with the `twin-builder` subagent in a scratch worktree of the
base branch, giving it only the task statement and that path (fallback if
subagents are unavailable: build it yourself in the worktree before re-reading
the diff, and say so in the report). Then measure, justify-or-delete, run the tests and security passes,
and report in the skill's output format. Do not modify tracked files during
the review. End by offering to apply the delete list.
"""
