# /design-review <description of the planned change, or files of a draft>
# Review a design/approach BEFORE implementation.

description = "Review a proposed design or approach against design principles before writing the code"

prompt = """
Review the following planned change BEFORE any implementation happens:

{{args}}

If no plan was given above, ask for one sentence describing what is about to be
built, or infer it from the current conversation.

Apply the `design-patterns` and `code-quality-core` skills:
1. Restate the forces: what varies, what must stay stable, who must not know
   what.
2. Assess the proposed structure: responsibilities per component, coupling and
   dependency direction, testability seams, and whether any pattern used is
   justified by the stated forces (flag over-engineering explicitly — an
   unnecessary interface/layer/pattern is a finding, not a style choice).
3. Propose the SIMPLEST structure that resolves the forces, as a short list of
   components with one-line responsibilities.
4. List the edge cases and failure modes the design must handle, so tests can
   be planned up front.

Output: verdict (sound / needs changes), the component list, findings, and the
edge-case list. Do not write implementation code.
"""
